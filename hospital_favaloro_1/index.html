<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hospital Favaloro | Ingresar</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700;800&family=DM+Sans:ital,wght@0,300;0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body onload="checkLogin()">

<!-- Loading -->
<div id="loading-screen">
    <i class="fas fa-heart-pulse loader-cross"></i>
    <div class="loader-ring"></div>
    <p style="color: rgba(255,255,255,0.8); margin-top: 1.2rem; font-family:'Sora',sans-serif; font-size:0.85rem; letter-spacing:0.1em;">HOSPITAL FAVALORO</p>
</div>

<div id="toast" class="toast"></div>

<!-- AUTH -->
<div id="auth-container">
    <div class="auth-card">

        <button id="medico-access-btn" class="medico-corner-btn" onclick="toggleModoMedico()">
            <i class="fas fa-user-doctor" id="medico-btn-icon"></i>
            <span id="medico-btn-text">Acceso médicos</span>
        </button>

        <div class="auth-logo">
            <i class="fas fa-heart-pulse"></i>
            <h1 id="auth-title">Iniciar Sesión</h1>
            <p id="auth-subtitle">Portal Digital del Hospital Favaloro</p>
        </div>

        <div id="auth-error" class="auth-error"><i class="fas fa-exclamation-triangle"></i> <span id="auth-error-msg"></span></div>

        <div id="reg-fields" style="display:none;">
            <div class="form-group"><label>Nombre</label><input type="text" id="auth-nombre" placeholder="Ej: María"></div>
            <div class="form-group"><label>Apellido</label><input type="text" id="auth-apellido" placeholder="Ej: García"></div>
            <div class="form-group"><label>DNI</label><input type="text" id="auth-dni" placeholder="Sin puntos ni espacios"></div>
            <div class="form-group"><label>Fecha de nacimiento</label><input type="date" id="auth-fecha-nac"></div>
            <div class="form-group"><label>Sexo</label>
                <select id="auth-sexo" class="ctrl">
                    <option value="M">Masculino</option>
                    <option value="F">Femenino</option>
                    <option value="X">Otro</option>
                </select>
            </div>
            <div class="form-group"><label>Teléfono (opcional)</label><input type="text" id="auth-telefono" placeholder="Ej: 1155667788"></div>

            <div class="form-group"><label>Domicilio</label><input type="text" id="auth-domicilio" placeholder="Calle, número, localidad"></div>
            <div class="form-group"><label>Obra Social</label><input type="text" id="auth-obra-social" placeholder="Ej: OSDE, Swiss Medical, PAMI..."></div>
            <div class="form-group"><label>Grupo Sanguíneo (opcional)</label>
                <select id="auth-grupo-sanguineo" class="ctrl">
                    <option value="">No especifica</option>
                    <option>A+</option><option>A-</option>
                    <option>B+</option><option>B-</option>
                    <option>AB+</option><option>AB-</option>
                    <option>O+</option><option>O-</option>
                </select>
            </div>
            <div class="form-group"><label>Alergias (opcional)</label><input type="text" id="auth-alergias" placeholder="Ej: Penicilina, ibuprofeno..."></div>
        </div>

        <div class="form-group"><label>Email</label><input type="email" id="email" placeholder="usuario@ejemplo.com"></div>
        <div class="form-group"><label>Contraseña</label><input type="password" id="password" placeholder="••••••••" onkeydown="if(event.key==='Enter') handleAuth()"></div>

        <button id="auth-submit-btn" class="btn btn-primary" style="width:100%; justify-content:center; font-size:0.95rem; padding: 0.9rem;" onclick="handleAuth()">
            <i class="fas fa-right-to-bracket"></i> Ingresar
        </button>

        <p id="toggle-register-wrap" style="text-align:center; margin-top:1.2rem; font-size:0.82rem; color:var(--muted);">
            <span id="auth-toggle-text">¿No tenés una cuenta?</span>
            <a href="javascript:void(0)" onclick="toggleRegisterMode()" style="color:var(--primary-light); font-weight:700; text-decoration:none;" id="auth-toggle-link">Regístrate aquí</a>
        </p>
    </div>
</div>

<script src="js/mock-api.js"></script>
<script src="js/common.js"></script>
<script src="js/auth.js"></script>
</body>
</html>
